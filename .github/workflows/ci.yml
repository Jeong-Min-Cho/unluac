name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # The script pins every Lua version and checksum, so its hash is the key.
      - name: Restore reference compilers
        id: luac-cache
        uses: actions/cache@v5
        with:
          path: ~/.local/bin
          key: luac-${{ runner.os }}-${{ hashFiles('tools/build-luac.sh') }}

      - name: Build reference compilers
        run: |
          if [ '${{ steps.luac-cache.outputs.cache-hit }}' != 'true' ]; then
            sudo apt-get update
            sudo apt-get install -y libreadline-dev
          fi
          bash tools/build-luac.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Smoke check
        run: bash ./unluac.sh --version

      - name: Run test suite
        run: |
          rm -rf build/classes && mkdir -p build/classes
          javac -d build/classes -sourcepath src src/unluac/Main.java src/unluac/test/RunTests.java
          set -o pipefail
          java -cp build/classes unluac.test.RunTests | tee suite.log

      # A missing compiler makes its tests skip while the run still exits 0.
      - name: Require no skipped tests
        run: |
          if [ "$(tail -n 1 suite.log)" != "All tests passed!" ]; then
            grep '^Skipped: ' suite.log || true
            echo "::error::The test suite skipped tests; a reference compiler is missing."
            exit 1
          fi
